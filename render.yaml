services:
  - type: web
    name: konverson
    runtime: static
    buildCommand: bash scripts/render-build.sh
    staticPublishPath: ./dist
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.wasm
        name: Content-Type
        value: application/wasm
      - path: /
        name: Cache-Control
        value: no-cache
